version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_ios_preview: ^1.0.0
  font_awesome_flutter: ^11.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
